<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Panini WC 2026</title>
<style>
  :root {
    --bg: #0a0a0f; --bg3: #1e1e2e; --gold: #e8b923;
    --green: #22c55e; --red: #f87171; --text: #e8e8f0; --muted: #666; --border: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  #header { background: linear-gradient(160deg, #1a1a2e 0%, #0f3460 100%); border-bottom: 2px solid var(--gold); padding: 14px 14px 12px; position: sticky; top: 0; z-index: 50; }
  #header h1 { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 2px; }
  #header .sub { text-align: center; font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
  .prog-bar-wrap { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
  .prog-stats { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .prog-track { background: rgba(255,255,255,0.1); border-radius: 999px; height: 6px; overflow: hidden; }
  .prog-fill { background: linear-gradient(90deg, #4ade80, #16a34a); height: 100%; border-radius: 999px; transition: width 0.3s ease; }
  #sync-status { text-align: center; font-size: 11px; padding: 3px 0 6px; }
  .search-wrap { position: relative; }
  .search-wrap::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
  #search { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 9px; padding: 9px 12px 9px 34px; color: var(--text); font-size: 14px; outline: none; }
  #list { padding: 10px 10px 80px; }
  .team-header { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; color: var(--text); cursor: pointer; text-align: left; transition: background 0.2s; }
  .team-header.done { background: linear-gradient(135deg, #052e16, #14532d); border-color: var(--green); }
  .team-header.open { border-radius: 12px 12px 0 0; }
  .team-left { display: flex; align-items: center; gap: 9px; }
  .team-flag { font-size: 20px; }
  .team-name { font-size: 14px; font-weight: 700; }
  .team-name.done { color: var(--green); }
  .team-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .team-right { display: flex; align-items: center; gap: 7px; }
  .badge { background: var(--gold); color: #000; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 2px 8px; }
  .badge.zero { background: var(--green); }
  .chevron { color: var(--muted); font-size: 11px; }
  .cards-list { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; overflow: hidden; display: none; margin-bottom: 7px; }
  .cards-list.open { display: block; }
  .card-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
  .card-row:last-child { border-bottom: none; }
  .card-row.found { background: rgba(34,197,94,0.05); }
  .card-info { flex: 1; min-width: 0; }
  .card-id { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; color: var(--gold); margin-right: 7px; }
  .card-id.found { color: var(--green); }
  .card-player { font-size: 13px; color: #ccc; }
  .card-player.found { color: var(--muted); text-decoration: line-through; }
  .check-btn { width: 42px; height: 42px; border-radius: 9px; border: none; cursor: pointer; font-size: 17px; flex-shrink: 0; margin-left: 8px; background: rgba(255,255,255,0.07); color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .check-btn.found { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
  .check-btn:active { transform: scale(0.9); }
  .team-wrap { margin-bottom: 7px; }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--green); color: #000; padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 300; }
  #loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
  #loading p { color: var(--muted); font-size: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #export-btn { width: 100%; background: rgba(232,185,35,0.12); border: 1px solid rgba(232,185,35,0.4); color: var(--gold); font-size: 13px; font-weight: 600; padding: 9px; border-radius: 9px; margin-top: 8px; cursor: pointer; transition: background 0.15s; }
  #export-btn:active { background: rgba(232,185,35,0.25); transform: scale(0.99); }
  #print-header { display: none; }
  @media print {
    @page { margin: 1.5cm; }
    body { background: white !important; color: black !important; }
    #header, #toast, #loading { display: none !important; }
    #print-header { display: block !important; margin-bottom: 14px; }
    #print-header h2 { font-size: 18px; margin: 0 0 4px; color: black; font-weight: 700; }
    #print-header p { font-size: 11px; color: #555; margin: 0; }
    #list { padding: 0 !important; }
    .team-wrap { margin-bottom: 6px !important; page-break-inside: avoid; }
    .team-wrap:has(.team-header.done) { display: none !important; }
    .cards-list { display: block !important; border-radius: 0 !important; background: white !important; border: 1px solid #ddd !important; border-top: none !important; }
    .card-row.found { display: none !important; }
    .check-btn, .chevron, .badge { display: none !important; }
    .team-header { background: #f3f3f3 !important; color: black !important; border: 1px solid #ccc !important; border-radius: 0 !important; padding: 6px 10px !important; }
    .team-name { color: black !important; font-size: 12px !important; font-weight: 700 !important; }
    .team-sub { color: #555 !important; font-size: 10px !important; }
    .team-flag { font-size: 13px !important; }
    .card-row { padding: 4px 10px !important; background: white !important; border-bottom: 1px solid #eee !important; }
    .card-id { color: #888 !important; font-size: 10px !important; }
    .card-player { color: black !important; font-size: 11px !important; text-decoration: none !important; }
  }
</style>

const TOTAL = TEAMS.reduce((s,t) => s + t.cards.length, 0);
let found = {};
let saveTimer = null;

// --- SUPABASE API ---
async function sbFetch(method, path, body) {
  const res = await fetch(SUPABASE_URL + path, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": method === "POST" ? "resolution=merge-duplicates,return=minimal" : ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const errText = await res.text();
    console.error(`Supabase ${method} ${path} → ${res.status}`, errText);
    throw new Error(`${res.status}: ${errText}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadFromDB() {
  try {
    const rows = await sbFetch("GET", `/rest/v1/panini_progress?user_id=eq.${USER_ID}&select=found_cards&order=updated_at.desc&limit=1`);
    if (rows && rows.length > 0) {
      found = rows[0].found_cards || {};
    }
    setSyncStatus("✅ Synchronisé", "#4ade80");
  } catch(e) {
    setSyncStatus("⚠️ Hors ligne — progression locale", "#f87171");
    // fallback localStorage
    try { const s = localStorage.getItem("panini_wc2026"); if(s) found = JSON.parse(s); } catch(_) {}
  }
}

async function saveToDB() {
  // Always save to localStorage as backup
  try { localStorage.setItem("panini_wc2026", JSON.stringify(found)); } catch(_) {}
  setSyncStatus("⏳ Sauvegarde...", "#e8b923");
  try {
    await sbFetch("POST", "/rest/v1/panini_progress?on_conflict=user_id", {
      user_id: USER_ID,
      found_cards: found,
      updated_at: new Date().toISOString()
    });
    setSyncStatus("✅ Synchronisé", "#4ade80");
  } catch(e) {
    setSyncStatus("⚠️ Erreur sync — " + e.message, "#f87171");
  }
}

function setSyncStatus(msg, color) {
  const el = document.getElementById("sync-status");
  if (el) { el.textContent = msg; el.style.color = color; }
}

function scheduleSync() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToDB, 800);
}

// --- UI ---
function updateStats() {
  const n = Object.keys(found).length;
  const pct = Math.round(n / TOTAL * 100);
  document.getElementById("cnt-found").textContent = n;
  document.getElementById("cnt-missing").textContent = TOTAL - n;
  document.getElementById("cnt-pct").textContent = pct + "%";
  document.getElementById("prog-fill").style.width = pct + "%";
}

function exportPDF() {
  const missingCount = TOTAL - Object.keys(found).length;
  if (missingCount === 0) {
    showToast("🎉 Collection complète !", "#22c55e");
    return;
  }
  const sub = document.getElementById("print-subtitle");
  if (sub) sub.textContent = `${missingCount} carte${missingCount > 1 ? "s" : ""} à trouver — ${new Date().toLocaleDateString("fr-FR")}`;
  window.print();
}

let toastTimer;
function showToast(msg, color="#22c55e") {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.background = color;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

function toggle(id) {
  if (found[id]) delete found[id]; else found[id] = true;
  updateStats();
  scheduleSync();
  const row = document.querySelector(`[data-id="${id}"]`);
  if (!row) return;
  const btn = row.querySelector(".check-btn");
  const pid = row.querySelector(".card-id");
  const pname = row.querySelector(".card-player");
  const isFound = !!found[id];
  row.classList.toggle("found", isFound);
  btn.classList.toggle("found", isFound);
  btn.textContent = isFound ? "✓" : "○";
  pid.classList.toggle("found", isFound);
  pname.classList.toggle("found", isFound);
  updateTeamHeader(row.closest(".cards-list").dataset.team);
}

function updateTeamHeader(teamId) {
  const t = TEAMS.find(t => t.team === teamId);
  if (!t) return;
  const n = t.cards.filter(c => found[c.id]).length;
  const done = n === t.cards.length;
  const hdr = document.querySelector(`.team-header[data-team="${teamId}"]`);
  if (!hdr) return;
  hdr.querySelector(".team-sub").textContent = `${n}/${t.cards.length}`;
  const badge = hdr.querySelector(".badge");
  badge.textContent = t.cards.length - n;
  badge.classList.toggle("zero", done);
  hdr.classList.toggle("done", done);
  const nameEl = hdr.querySelector(".team-name");
  nameEl.classList.toggle("done", done);
  nameEl.textContent = t.name + (done ? " ✓" : "");
}

function toggleTeam(teamId) {
  const list = document.querySelector(`.cards-list[data-team="${teamId}"]`);
  const hdr = document.querySelector(`.team-header[data-team="${teamId}"]`);
  if (!list) return;
  const isOpen = list.classList.contains("open");
  document.querySelectorAll(".cards-list.open").forEach(el => el.classList.remove("open"));
  document.querySelectorAll(".team-header.open").forEach(el => el.classList.remove("open"));
  if (!isOpen) { list.classList.add("open"); hdr.classList.add("open"); }
}

function filterList(q) {
  const lower = q.toLowerCase();
  TEAMS.forEach(t => {
    const wrap = document.querySelector(`.team-wrap[data-team="${t.team}"]`);
    if (!wrap) return;
    let any = false;
    t.cards.forEach(c => {
      const row = wrap.querySelector(`[data-id="${c.id}"]`);
      if (!row) return;
      const match = !q || c.player.toLowerCase().includes(lower) || c.label.toLowerCase().includes(lower) || t.name.toLowerCase().includes(lower);
      row.style.display = match ? "" : "none";
      if (match) any = true;
    });
    wrap.style.display = any ? "" : "none";
    const list = wrap.querySelector(".cards-list");
    const hdr = wrap.querySelector(".team-header");
    if (q && any) { list.classList.add("open"); hdr.classList.add("open"); }
    else if (!q) { list.classList.remove("open"); hdr.classList.remove("open"); }
  });
}

function renderAll() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  TEAMS.forEach(t => {
    const teamFound = t.cards.filter(c => found[c.id]).length;
    const done = teamFound === t.cards.length;
    const wrap = document.createElement("div");
    wrap.className = "team-wrap"; wrap.dataset.team = t.team;
    wrap.innerHTML = `
      <button class="team-header${done?" done":""}" data-team="${t.team}" onclick="toggleTeam('${t.team}')">
        <div class="team-left">
          <span class="team-flag">${t.flag}</span>
          <div>
            <div class="team-name${done?" done":""}">${t.name}${done?" ✓":""}</div>
            <div class="team-sub">${teamFound}/${t.cards.length}</div>
          </div>
        </div>
        <div class="team-right">
          <span class="badge${done?" zero":""}">${t.cards.length - teamFound}</span>
          <span class="chevron">▼</span>
        </div>
      </button>
      <div class="cards-list" data-team="${t.team}">
        ${t.cards.map(c => `
          <div class="card-row${found[c.id]?" found":""}" data-id="${c.id}">
            <div class="card-info">
              <span class="card-id${found[c.id]?" found":""}">${c.label}</span>
              <span class="card-player${found[c.id]?" found":""}">${c.player}</span>
            </div>
            <button class="check-btn${found[c.id]?" found":""}" onclick="toggle('${c.id}')">${found[c.id]?"✓":"○"}</button>
          </div>
        `).join("")}
      </div>`;
    list.appendChild(wrap);
  });
  updateStats();
}

// --- INIT ---
(async () => {
  await loadFromDB();
  renderAll();
  document.getElementById("loading").style.display = "none";
  document.getElementById("header").style.display = "block";
})();
